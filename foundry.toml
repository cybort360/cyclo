[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "scripts"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
arc = "${ARC_RPC_URL}"

[etherscan]
arc = { key = "placeholder", url = "https://testnet.arcscan.app" }
